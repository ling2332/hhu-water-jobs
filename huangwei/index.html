<title>资料页</title>
<style>
:root{--bg:#F0F2F1;--surface:#fff;--ink:#1D2A2E;--muted:#5B6A6E;--line:#D6DCDB;--accent:#A8680E;--bad:#A9443A}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111A1D;--surface:#172328;--ink:#E3EBEC;--muted:#97A8AC;--line:#2C3E44;--accent:#E0A54A;--bad:#E48A7E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);padding:24px 22px;display:grid;gap:14px}
h1{margin:0;font-size:20px;font-family:"Songti SC","SimSun",serif}
p{margin:0;font-size:13px;color:var(--muted)}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-size:15px;padding:10px;border:0;border-radius:4px;background:var(--ink);color:var(--surface);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#msg{min-height:1.2em;color:var(--bad)}
</style></head><body>

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.d));
  return new TextDecoder().decode(buf);
}
async function open(pw, quiet){
  const btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.disabled = true; msg.textContent = '';
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem('pg_pw', pw); } catch(e) {}
    document.open(); document.write(html); document.close();
  } catch(e) {
    btn.disabled = false;
    if (!quiet) msg.textContent = (window.crypto && crypto.subtle) ? '密码不对，请再试一次。' : '这个浏览器不支持解密，请换用系统自带浏览器或 Chrome 打开。';
  }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); open(document.getElementById('pw').value, false); });
try { const s = sessionStorage.getItem('pg_pw'); if (s) open(s, true); } catch(e) {}
</script>
